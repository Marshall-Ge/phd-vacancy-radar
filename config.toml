[monitor]
digest_every_days = 5
digest_hour = 9                  # 本地时间 9 点后发汇总
timezone = "Asia/Shanghai"
alert_score = 5.0                # 新项目达到这个分数立即发邮件
award_alert_score = 8.0          # 新 funding 达到这个分数立即发邮件
max_items_per_email = 10          # 即时告警最多列几条
digest_max_items = 150            # 5 天汇总最多列几条（尽量全）
digest_detail_items = 8           # 其中前几条用详细卡片，其余用紧凑清单
digest_attachment = "csv"         # 汇总附件：csv / html / both / none
startup_email = true             # 首次运行发「监控已启动」+ 基线
state_file = "state.json"
failure_alert_after_hours = 12
failure_alert_cooldown_hours = 24

[notify]
provider = "smtp"
to = []                          # 1-2 个邮箱；也可用 GitHub Secret MAIL_TO（逗号分隔）
from_name = "PhD Vacancy Radar"
smtp_host = "smtp.163.com"
smtp_port = 465
smtp_ssl = true
# MAIL_USERNAME / MAIL_PASSWORD（授权码）走环境变量或 GitHub Secrets
username = ""
password = ""
resend_from = "onboarding@resend.dev"

# ---------------------------------------------------------------------------
# 项目源（招博士）
# ---------------------------------------------------------------------------

[[source]]
type = "jobs_ac_uk"
name = "jobs.ac.uk"
enabled = true
queries = [
  "PhD quantitative marketing",
  "PhD consumer analytics",
  "PhD marketing AI",
  "PhD data-driven decision",
  "PhD business analytics",
  "PhD information systems",
  "PhD digital transformation",
  "PhD marketing",
  "PhD consumer behaviour",
]
pages = 1

[[source]]
type = "academic_transfer"
name = "AcademicTransfer"
enabled = true
max_details = 20
newest = 10
domain = 15

[[source]]
type = "uni_page"
name = "UCPH"
enabled = true
url = "https://employment.ku.dk/all-vacancies"
institution = "University of Copenhagen"
country = "DK"
href_contains = "/all-vacancies?show="
keywords = ["phd", "doctoral"]

# ---------------------------------------------------------------------------
# funding / PI 源
# ---------------------------------------------------------------------------

[[source]]
type = "gepris"
name = "GEPRIS"
enabled = true
queries = ["quantitative marketing", "consumer analytics", "data-driven decision", "information systems", "digital transformation", "business analytics", "Wirtschaftsinformatik", "Digitalisierung"]
size = 50
years_back = 2

[[source]]
type = "nwo"
name = "NWO"
enabled = true
topics = ["quantitative marketing", "consumer analytics", "data-driven decision", "information systems", "digital transformation"]
page_size = 50
years_back = 3

[[source]]
type = "ukri"
name = "UKRI GtR"
enabled = true
queries = ["quantitative marketing", "consumer analytics", "data-driven decision", "information systems", "business analytics"]
size = 50
years_back = 3
