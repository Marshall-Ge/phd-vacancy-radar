# PhD Vacancy Radar 配置
# 关键词库来自《欧洲岗位制PhD_AI追踪关键词库.xlsx》，按 A/B/C/D 四个板块 + 子方向组织。

[profile]
name = "消费者分析 / 数据驱动决策 / 信息系统与数字化转型"
methods = [
  "quantitative", "causal inference", "econometrics", "statistics", "statistical",
  "field experiment", "experiment", "empirical", "panel data", "machine learning",
  "text mining", "natural language processing", "consumer choice model", "demand estimation",
]
negative = ["self-funded", "self funded", "tuition fees", "unpaid", "fee-paying"]
negative_domains = [
  "law", "legal", "medical", "clinical", "health", "nursing", "biology", "biomedical",
  "genomic", "genetics", "fisheries", "aquaculture", "physics", "chemistry", "chemical",
  "museum", "heritage", "archaeology", "history", "theology", "geology",
  "railway", "cardiac", "ecology", "public health", "education", "psychology",
  "robot", "robotics", "autonomy", "autonomous", "engineering", "manufacturing",
  "materials", "polymer", "quantum", "astrophysics", "geoscience", "neuroscience",
  "climate", "energy", "flood", "infrastructure", "hydrogel", "molecular", "cell",
  "virus", "virology", "genomics", "proteomics", "metabolism", "cancer", "disease",
]
country_bonus = { NL = 3.0, DK = 3.0, DE = 2.0, UK = 1.0, SE = 1.0, BE = 1.0, AT = 1.0, CH = 1.0, FI = 1.0, NO = 1.0 }


